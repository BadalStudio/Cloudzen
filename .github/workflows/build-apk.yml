name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Prepare web files and add Android project
        run: |
          npm run build:www
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Keep APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pocket-code-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK as a GitHub Release (easy download on phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: Pocket Code APK #${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
